name: Build Polymer APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: unzip PolymerLauncher_project_download.zip -d extracted

      - name: Find Gradle project
        run: find extracted -name settings.gradle -o -name settings.gradle.kts

      - name: Build APK
        run: |
          PROJECT=$(dirname "$(find extracted -name settings.gradle -o -name settings.gradle.kts | head -n 1)")
          gradle -p "$PROJECT" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Polymer-APK
          path: extracted/**/*.apk
